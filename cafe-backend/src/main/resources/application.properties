spring.application.name=cafe-backend
server.port=${PORT:8080}

# mysql://root:q9QH8nEahy4di3dICr7bKoqf@cafe-management-system-coy-bend.ovh2.cloud.layerbase.dev:16753/cafe_management_system?ssl-mode=REQUIRED

# Cloud MySQL Database Configuration (Aiven MySQL 8.4)
spring.datasource.url=${DB_URL:jdbc:mysql://cloud.layerbase.dev:15786/cafe-management-system?useSSL=true&verifyServerCertificate=false&allowPublicKeyRetrieval=true&connectTimeout=10000&socketTimeout=30000}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:q9QH8nEahy4di3dICr7bKoqf}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings for Aiven MySQL
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# H2 Console Configuration (Disabled for MySQL)
spring.h2.console.enabled=false

# Disable SQL Script Initialization (data.sql / schema.sql)
spring.sql.init.mode=never

# JWT Security Configuration
cafe.app.jwtSecret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
cafe.app.jwtExpirationMs=${JWT_EXPIRATION:86400000}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads

# WebSocket Configuration
websocket.allowed-origins=*

# OpenAPI / Swagger Config
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
