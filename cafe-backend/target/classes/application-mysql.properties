spring.application.name=cafe-backend
server.port=8080

# MySQL Database Configuration (SQLYog Database: cafe_management)
spring.datasource.url=jdbc:mysql://localhost:3306/cafe_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=mohan
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable Script Initialization (Data is fetched 100% directly from MySQL SQLYog database)
spring.sql.init.mode=never

# JWT Security Configuration
cafe.app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
cafe.app.jwtExpirationMs=86400000

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads

# WebSocket Configuration
websocket.allowed-origins=http://localhost:4200

# OpenAPI / Swagger Config
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
