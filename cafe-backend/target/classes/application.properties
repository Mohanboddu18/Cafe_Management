spring.application.name=cafe-backend
server.port=${PORT:8080}

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/cafe_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=mohan
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# H2 Console Configuration (Disabled for MySQL)
spring.h2.console.enabled=false

# Disable SQL Script Initialization (data.sql / schema.sql)
spring.sql.init.mode=never

# JWT Security Configuration
cafe.app.jwtSecret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
cafe.app.jwtExpirationMs=${JWT_EXPIRATION:86400000}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads

# WebSocket Configuration
websocket.allowed-origins=*

# OpenAPI / Swagger Config
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
